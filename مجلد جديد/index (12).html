<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEXTER — ديكستر | موقع الغول</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #d4121c;
    --accent-2: #7d0a12;
    --accent-3: #0fa3a3;
    --bg: #070506;
  }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 28px 20px 70px;
    overflow-x: hidden;
    position: relative;
  }

  /* ================= الخلفية المتحركة ================= */
  .bg-scene {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #2a0709 0%, #070506 62%);
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    will-change: transform;
  }
  .orb-1 {
    width: 540px; height: 540px;
    background: radial-gradient(circle, #d4121c, transparent 70%);
    top: -160px; right: -120px;
    opacity: .42;
    animation: drift1 22s ease-in-out infinite;
  }
  .orb-2 {
    width: 620px; height: 620px;
    background: radial-gradient(circle, #8a0a14, transparent 70%);
    bottom: -220px; left: -180px;
    opacity: .38;
    animation: drift2 28s ease-in-out infinite;
  }
  .orb-3 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #0fa3a3, transparent 70%);
    top: 42%; left: 46%;
    opacity: .18;
    animation: drift3 20s ease-in-out infinite;
  }
  .bg-grid {
    position: absolute;
    inset: -64px;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 25%, #000 0%, transparent 72%);
    mask-image: radial-gradient(ellipse at 50% 25%, #000 0%, transparent 72%);
    animation: gridMove 45s linear infinite;
  }
  .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.75) 100%);
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(-70px, 80px) scale(1.15); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(80px,-70px) scale(1.2); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0,0) scale(1); opacity: .16; }
    50%      { transform: translate(-60px,-50px) scale(1.35); opacity: .3; }
  }
  @keyframes gridMove { to { background-position: 64px 64px; } }

  /* ================= الهيدر ================= */
  .site-header {
    text-align: center;
    margin-bottom: 30px;
    animation: fadeDown .9s cubic-bezier(.2,.8,.2,1) both;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .brand-icon {
    width: 58px; height: 58px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, rgba(212,18,28,.28), rgba(15,163,163,.22));
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 0 34px rgba(212,18,28,.35), inset 0 0 20px rgba(255,255,255,.06);
    animation: iconPulse 3s ease-in-out infinite;
  }
  .brand-icon svg {
    width: 30px; height: 30px;
    fill: var(--accent);
    filter: drop-shadow(0 0 8px rgba(212,18,28,.9));
  }
  @keyframes iconPulse {
    0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 34px rgba(212,18,28,.35), inset 0 0 20px rgba(255,255,255,.06); }
    50%      { transform: translateY(-4px) scale(1.04); box-shadow: 0 0 50px rgba(212,18,28,.55), inset 0 0 20px rgba(255,255,255,.1); }
  }

  .site-title {
    font-size: clamp(1.9rem, 5.5vw, 3.2rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: 6px;
    position: relative;
    font-family: Impact, 'Arial Black', 'Segoe UI', sans-serif;
    background: linear-gradient(100deg, #ffffff 0%, #ff5a5a 22%, #d4121c 45%, #8a0a14 68%, #ffffff 100%);
    background-size: 260% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
    filter: drop-shadow(0 6px 26px rgba(212,18,28,.35));
  }
  @keyframes shine { to { background-position: 260% center; } }

  .site-tagline {
    margin-top: 12px;
    font-size: .95rem;
    color: rgba(255,255,255,.55);
    letter-spacing: .5px;
    animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) .25s both;
  }

  .title-underline {
    width: 130px; height: 3px;
    margin: 16px auto 0;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
    animation: pulseLine 2.6s ease-in-out infinite;
  }
  @keyframes pulseLine {
    0%, 100% { transform: scaleX(.55); opacity: .45; }
    50%      { transform: scaleX(1);   opacity: 1; }
  }

  @keyframes fadeUp   { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: translateY(0); } }

  /* ================= المحتوى ================= */
  .site-main {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .player-wrap {
    position: relative;
    animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) .15s both;
  }
  /* توهج خلف المشغل */
  .player-wrap::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(212,18,28,.75), rgba(15,163,163,.6), rgba(125,10,18,.65));
    filter: blur(22px);
    opacity: .4;
    z-index: 0;
    animation: glowPulse 5s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%, 100% { opacity: .3; } 50% { opacity: .62; } }

  /* ================= المشغل (كما هو) ================= */
  .player-container {
    width: 100%;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    position: relative;
    aspect-ratio: 16 / 9;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    border: 1px solid rgba(255,255,255,.08);
    z-index: 1;
    transition: cursor 0.3s;
  }

  .player-container:fullscreen {
    width: 100vw;
    height: 100vh;
    max-width: none;
    aspect-ratio: auto;
    border-radius: 0;
    border: none;
  }

  .player-container.idle { cursor: none; }
  .player-container.idle .controls { opacity: 0; pointer-events: none; }
  .player-container.idle .center-play-btn { opacity: 0; }
  .player-container.idle .now-playing { opacity: 0; }

  video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    cursor: pointer;
    background: #000;
  }

  /* شارة اسم الفيديو الحالي */
  .now-playing {
    position: absolute;
    top: 18px;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    font-size: .84rem;
    backdrop-filter: blur(10px);
    z-index: 15;
    pointer-events: none;
    opacity: 1;
    transition: opacity .4s ease;
  }
  .now-playing .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  /* زر التشغيل الكبير في المنتصف */
  .center-play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 1;
    z-index: 12;
  }
  .center-play-btn:hover { background: rgba(212,18,28,.75); transform: translate(-50%,-50%) scale(1.08); }
  .player-container.playing .center-play-btn { display: none; }
  .center-play-btn svg { width: 45px; height: 45px; fill: #fff; margin-left: 5px; }

  /* غطاء التبديل بين الفيديوهات */
  .switch-overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(5px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
    z-index: 30;
  }
  .player-container.switching .switch-overlay { opacity: 1; pointer-events: auto; }
  .spinner {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* رسالة الخطأ */
  .video-error {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    text-align: center;
    padding: 24px;
    background: rgba(0,0,0,.86);
    color: #ffb3b3;
    font-size: .95rem;
    line-height: 1.8;
    z-index: 25;
  }
  .video-error.show { display: grid; }

  /* ================= لوحة التحكم (كما هي) ================= */
  .controls {
    position: relative;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
    padding: 40px 25px 20px 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    opacity: 1;
    transition: opacity 0.4s ease;
    z-index: 10;
  }

  .progress-container {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    direction: ltr;
    transition: height 0.2s;
  }
  .progress-container:hover { height: 10px; }

  .progress-buffered {
    position: absolute; left: 0; height: 100%;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 4px;
    pointer-events: none;
  }
  .progress-played {
    position: absolute; left: 0; height: 100%;
    background: #ff0000;
    border-radius: 4px;
    pointer-events: none;
  }
  .progress-thumb {
    position: absolute;
    width: 18px; height: 18px;
    background: #ff0000;
    border-radius: 50%;
    transform: translateX(-50%) scale(0);
    transition: transform 0.2s;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
  }
  .progress-container:hover .progress-thumb { transform: translateX(-50%) scale(1); }

  .preview-box {
    position: absolute;
    bottom: 30px;
    width: 180px;
    height: 101px;
    background: #000;
    border-radius: 6px;
    border: 2px solid #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    overflow: hidden;
    display: none;
    pointer-events: none;
    transform: translateX(-50%);
    z-index: 20;
  }
  .preview-box canvas { width: 100%; height: 100%; }
  .preview-time {
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 13px;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: monospace;
  }

  .buttons-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: ltr;
  }

  .right-controls, .left-controls {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .controls button {
    background: transparent;
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.8;
    transition: opacity 0.2s, transform 0.1s;
  }
  .controls button:hover { opacity: 1; transform: scale(1.1); }
  .controls button svg { width: 28px; height: 28px; fill: currentColor; }

  .skip-btn { position: relative; }
  .skip-num {
    position: absolute;
    font-size: 11px;
    font-weight: bold;
    top: 55%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .time-display {
    color: #fff;
    font-size: 15px;
    font-family: monospace;
    opacity: 0.9;
    direction: ltr;
  }

  .volume-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 90px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
  }

  .speed-select {
    background: transparent;
    color: #fff;
    border: none;
    font-size: 15px;
    cursor: pointer;
    outline: none;
    opacity: 0.8;
    font-weight: bold;
  }
  .speed-select:hover { opacity: 1; }
  .speed-select option { background: #1a1a1a; color: #fff; }

  /* ================= قائمة الفيديوهات ================= */
  .playlist-section {
    animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) .35s both;
  }

  .section-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,.85);
  }
  .section-title::before {
    content: '';
    width: 4px; height: 20px;
    border-radius: 4px;
    background: linear-gradient(var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(212,18,28,.7);
  }

  .playlist {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .video-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    cursor: pointer;
    text-align: right;
    color: #fff;
    font-family: inherit;
    position: relative;
    overflow: hidden;
    transition: transform .3s cubic-bezier(.2,.8,.2,1),
                background .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
  }
  .video-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.10) 50%, transparent 70%);
    transform: translateX(-130%);
    transition: transform .75s ease;
    pointer-events: none;
  }
  .video-card:hover::after { transform: translateX(130%); }
  .video-card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,.07);
    border-color: rgba(212,18,28,.4);
    box-shadow: 0 16px 36px -14px rgba(0,0,0,.85);
  }
  .video-card.active {
    background: linear-gradient(135deg, rgba(212,18,28,.20), rgba(125,10,18,.08));
    border-color: rgba(212,18,28,.6);
    box-shadow: 0 0 0 1px rgba(212,18,28,.25), 0 16px 36px -16px rgba(212,18,28,.65);
  }

  .card-index {
    font-size: 1.35rem;
    font-weight: 900;
    font-family: monospace;
    color: rgba(255,255,255,.25);
    transition: color .3s ease, text-shadow .3s ease;
  }
  .video-card.active .card-index {
    color: var(--accent);
    text-shadow: 0 0 16px rgba(212,18,28,.9);
  }

  .card-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .card-title { font-weight: 700; font-size: .96rem; }
  .card-sub {
    font-size: .76rem;
    opacity: .55;
    font-family: monospace;
    direction: ltr;
    text-align: right;
  }

  .card-play {
    width: 34px; height: 34px;
    flex: 0 0 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.08);
    opacity: 0;
    transform: scale(.8);
    transition: opacity .3s ease, transform .3s ease, background .3s ease;
  }
  .card-play svg { width: 16px; height: 16px; fill: #fff; }
  .video-card:hover .card-play,
  .video-card.active .card-play { opacity: 1; transform: scale(1); }
  .video-card.active .card-play { background: var(--accent); box-shadow: 0 0 18px rgba(212,18,28,.75); }

  /* ================= الفوتر ================= */
  .site-footer {
    margin-top: 42px;
    font-size: .8rem;
    color: rgba(255,255,255,.35);
    letter-spacing: .5px;
    animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) .55s both;
  }
  .site-footer span { color: var(--accent); }

  /* ================= استجابة الشاشات ================= */
  @media (max-width: 860px) {
    .playlist { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    body { padding: 20px 14px 50px; }
    .brand-icon { width: 46px; height: 46px; border-radius: 13px; }
    .brand-icon svg { width: 24px; height: 24px; }
    .site-tagline { font-size: .82rem; }
    .playlist { grid-template-columns: 1fr; }
    .time-display { display: none; }
    .volume-container input { display: none; }
    .speed-select { display: none; }
    .controls button svg { width: 24px; height: 24px; }
    .controls { padding: 30px 15px 14px 15px; gap: 10px; }
    .center-play-btn { width: 70px; height: 70px; }
    .center-play-btn svg { width: 34px; height: 34px; }
    .now-playing { top: 10px; right: 10px; font-size: .75rem; padding: 6px 11px; }
    .right-controls, .left-controls { gap: 14px; }
  }

  /* ================= طابع ديكستر ================= */
  .blood-drips {
    position: fixed; top: 0; left: 0; width: 100%; height: 150px;
    z-index: 0; pointer-events: none;
    filter: drop-shadow(0 6px 14px rgba(120,0,10,.55));
  }
  .blood-drips path { fill: #a30d16; }
  .blood-drips .drop { animation: dripFall 7s ease-in infinite; transform-box: fill-box; }
  .blood-drips .d2 { animation-delay: 2.3s; }
  .blood-drips .d3 { animation-delay: 4.6s; }
  @keyframes dripFall {
    0%   { transform: translateY(0); opacity: 0; }
    10%  { opacity: 1; }
    70%  { transform: translateY(70px); opacity: 1; }
    100% { transform: translateY(110px); opacity: 0; }
  }
  .blood-pool {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
    z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 100%, rgba(150,8,18,.75), transparent 70%);
  }
  body > *:not(.bg-scene):not(.blood-drips):not(.blood-pool) { position: relative; z-index: 1; }

  .site-title::after {
    content: ''; position: absolute; left: -4%; right: -4%; top: 38%;
    height: 3px; background: #fff; opacity: .85;
    transform: rotate(-14deg); box-shadow: 0 0 10px rgba(212,18,28,.9);
    -webkit-text-fill-color: initial;
  }
  .site-header { padding-top: 40px; }
  .site-tagline { color: rgba(255,210,210,.6); }
  .site-tagline::before, .site-tagline::after { content: ' ✦ '; color: var(--accent); }

  /* الصور الثلاث أعلى الموقع */
  .photo-stack { width: 100%; display: flex; flex-direction: column; gap: 22px; }
  .photo-frame {
    position: relative; border-radius: 12px; overflow: hidden; line-height: 0;
    background: #000;
    border: 1px solid rgba(212,18,28,.55);
    box-shadow: 0 0 0 1px rgba(0,0,0,.8), 0 18px 40px -14px rgba(0,0,0,.9), 0 0 34px -8px rgba(212,18,28,.55);
    animation: fadeUp .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .photo-frame:nth-child(2) { animation-delay: .12s; }
  .photo-frame:nth-child(3) { animation-delay: .24s; }
  .photo-frame img { display: block; width: 100%; height: auto; }
  .photo-frame::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 60px rgba(90,0,8,.45);
  }
  .section-title { color: #ffd9d9; }
  .section-title::before { box-shadow: 0 0 12px rgba(212,18,28,.9); }
  .card-sub.en { font-family: Georgia, serif; font-style: italic; opacity: .75; text-align: right; }
  .site-footer span { color: var(--accent); font-weight: 700; }

  /* ================= الهيرو: Dexter Resurrection ================= */
  .hero { margin-bottom: 44px; padding-top: 56px; }
  .title-wrap, .sub-wrap { position: relative; display: inline-block; }
  .hero-title {
    font-family: Impact, 'Arial Black', 'Segoe UI', sans-serif;
    font-size: clamp(4rem, 17vw, 10.5rem);
    font-weight: 900; font-style: italic; line-height: .95;
    letter-spacing: 4px; direction: ltr;
    background: linear-gradient(180deg, #ff4a4a 0%, #d4121c 38%, #7d0a12 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 8px 30px rgba(212,18,28,.55)) drop-shadow(0 2px 0 rgba(0,0,0,.6));
    animation: none; position: relative;

  }
  .hero-sub::before, .hero-sub::after {
    content: ''; display: inline-block; width: clamp(24px, 7vw, 80px); height: 2px;
    vertical-align: middle; margin: 0 .8em;
    background: linear-gradient(90deg, transparent, #d4121c);
  }
  .hero-sub::after { transform: scaleX(-1); }

  .drip {
    position: absolute; top: 80%; width: 9px; height: var(--h);
    margin-left: -4px; pointer-events: none;
    background: linear-gradient(180deg, #d4121c, #8a0a14);
    border-radius: 0 0 9px 9px; transform-origin: top;
    animation: dripGrow 6s ease-in-out infinite; animation-delay: var(--d);
    filter: drop-shadow(0 4px 8px rgba(120,0,10,.7));
  }
  .drip::after {
    content: ''; position: absolute; bottom: -7px; left: 50%; width: 13px; height: 15px;
    margin-left: -6.5px; background: #8a0a14; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  }
  .sub-wrap .drip { top: 70%; width: 6px; margin-left: -3px; }
  .drip.sm::after { width: 9px; margin-left: -4.5px; height: 11px; bottom: -5px; }
  @keyframes dripGrow {
    0%   { transform: scaleY(.15); opacity: 0; }
    12%  { opacity: 1; }
    60%  { transform: scaleY(1); opacity: 1; }
    85%  { transform: scaleY(1) translateY(16px); opacity: .9; }
    100% { transform: scaleY(1) translateY(34px); opacity: 0; }

  .splat { position: absolute; border-radius: 50%; background: #b30d18; pointer-events: none; opacity: .85; filter: blur(.3px); }
  .splat.s1 { width: 12px; height: 12px; top: 6%;  left: 9%; }

  .photo-stack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

<script>
/* ============================================================
   ✏️ عدّل هذه القائمة فقط لإضافة / تغيير الفيديوهات
   الملفات يجب أن تكون في نفس مجلد الصفحة
   ============================================================ */
const videoSources = [
  { file: 'video1.mp4', title: 'عمل محفوف بالمخاطر', en: 'Risky Business' },
  { file: 'video2.mp4', title: 'الساقط',              en: 'Fallen' },
  { file: 'video3.mp4', title: 'عيش حرًا وفُت',        en: 'Live Free and Die' }
];
/* ============================================================ */

const video              = document.getElementById('video');
const playerContainer    = document.getElementById('playerContainer');
const controls           = document.getElementById('controls');
const playBtn            = document.getElementById('playBtn');
const playIcon           = document.getElementById('playIcon');
const centerPlayBtn      = document.getElementById('centerPlayBtn');
const backBtn            = document.getElementById('backBtn');
const fwdBtn             = document.getElementById('fwdBtn');
const currentTimeEl      = document.getElementById('currentTime');
const durationEl         = document.getElementById('duration');
const progressContainer  = document.getElementById('progressContainer');
const progressPlayed     = document.getElementById('progressPlayed');
const progressBuffered   = document.getElementById('progressBuffered');
const progressThumb      = document.getElementById('progressThumb');
const previewBox         = document.getElementById('previewBox');
const previewCanvas      = document.getElementById('previewCanvas');
const previewTime        = document.getElementById('previewTime');
const previewCtx         = previewCanvas.getContext('2d');
const muteBtn            = document.getElementById('muteBtn');
const volIcon            = document.getElementById('volIcon');
const volumeSlider       = document.getElementById('volumeSlider');
const speedSelect        = document.getElementById('speedSelect');
const fsBtn              = document.getElementById('fsBtn');
const playlistEl         = document.getElementById('playlist');
const nowPlayingText     = document.getElementById('nowPlayingText');
const videoError         = document.getElementById('videoError');

const SKIP_SECONDS = 7;
let isSeeking = false;
let hideControlsTimeout;
let previewVideo = null;
let previewReady = false;
let currentIndex = 0;
let switching = false;

/* ================= بناء قائمة الفيديوهات ================= */
videoSources.forEach((v, i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'video-card' + (i === 0 ? ' active' : '');
  btn.innerHTML = `
    <span class="card-index">0${i + 1}</span>
    <span class="card-info">
      <span class="card-title">${v.title}</span>
      <span class="card-sub en">${v.en}</span>
      <span class="card-sub">${v.file}</span>
    </span>
    <span class="card-play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </span>
  `;
  btn.addEventListener('click', () => selectVideo(i));
  playlistEl.appendChild(btn);
});

/* ================= التبديل بين الفيديوهات ================= */
function selectVideo(index) {
  if (switching || index === currentIndex) return;
  switching = true;

  const data = videoSources[index];
  nowPlayingText.textContent = data.title + ' · ' + data.en;

  // تعليم الكارت النشط
  [...playlistEl.children].forEach((c, i) => c.classList.toggle('active', i === index));

  // إظهار غطاء التبديل
  playerContainer.classList.add('switching');
  playerContainer.classList.remove('idle');

  setTimeout(() => {
    // تصفير المعاينة المصغرة
    if (previewVideo) {
      previewVideo.pause();
      previewVideo.removeAttribute('src');
      previewVideo.load();
      previewVideo = null;
    }
    previewReady = false;
    isSeeking = false;
    videoError.classList.remove('show');

    // تصفير شريط التقدم
    progressPlayed.style.width = '0%';
    progressBuffered.style.width = '0%';
    progressThumb.style.left = '0%';
    currentTimeEl.textContent = '0:00';
    durationEl.textContent = '0:00';

    // تحميل الفيديو الجديد
    video.src = data.file;
    video.load();
    currentIndex = index;

    const p = video.play();
    if (p && p.catch) p.catch(() => {});

    setTimeout(() => {
      playerContainer.classList.remove('switching');
      switching = false;
    }, 380);
  }, 380);
}

/* ================= أدوات مساعدة ================= */
function formatTime(sec) {
  if (isNaN(sec) || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function togglePlay() {
  if (video.paused) video.play();
  else video.pause();
}

/* ================= أحداث التشغيل ================= */
playBtn.addEventListener('click', togglePlay);
centerPlayBtn.addEventListener('click', togglePlay);
video.addEventListener('click', togglePlay);

video.addEventListener('play', () => {
  playerContainer.classList.add('playing');
  playIcon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  startHideControlsTimer();
});

video.addEventListener('pause', () => {
  playerContainer.classList.remove('playing');
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  playerContainer.classList.remove('idle');
  clearTimeout(hideControlsTimeout);
});

/* ================= إخفاء لوحة التحكم ================= */
function startHideControlsTimer() {
  clearTimeout(hideControlsTimeout);
  playerContainer.classList.remove('idle');
  hideControlsTimeout = setTimeout(() => {
    if (!video.paused) playerContainer.classList.add('idle');
  }, 5000);
}

playerContainer.addEventListener('mousemove', startHideControlsTimer);

/* ================= تحديث الوقت ================= */
video.addEventListener('loadedmetadata', () => {
  durationEl.textContent = formatTime(video.duration);
  videoError.classList.remove('show');
  setupPreviewVideo();
});

video.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  currentTimeEl.textContent = formatTime(video.currentTime);
  const pct = (video.currentTime / video.duration) * 100 || 0;
  progressPlayed.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
});

video.addEventListener('progress', () => {
  if (video.buffered.length > 0 && isFinite(video.duration)) {
    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
    const pct = (bufferedEnd / video.duration) * 100 || 0;
    progressBuffered.style.width = pct + '%';
  }
});

video.addEventListener('error', () => {
  videoError.classList.add('show');
  playerContainer.classList.remove('switching');
  switching = false;
});

/* ================= أزرار التقديم والتأخير ================= */
backBtn.addEventListener('click', () => {
  video.currentTime = Math.max(0, video.currentTime - SKIP_SECONDS);
});
fwdBtn.addEventListener('click', () => {
  video.currentTime = Math.min(video.duration || 0, video.currentTime + SKIP_SECONDS);
});

/* ================= السحب على شريط التقدم ================= */
function seekFromEvent(e) {
  if (!isFinite(video.duration)) return;
  const rect = progressContainer.getBoundingClientRect();
  let clientX = e.clientX;
  if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;

  const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  video.currentTime = pct * video.duration;

  progressPlayed.style.width = (pct * 100) + '%';
  progressThumb.style.left = (pct * 100) + '%';
  currentTimeEl.textContent = formatTime(video.currentTime);
}

progressContainer.addEventListener('mousedown', (e) => {
  isSeeking = true;
  seekFromEvent(e);
});
document.addEventListener('mousemove', (e) => { if (isSeeking) seekFromEvent(e); });
document.addEventListener('mouseup', () => { isSeeking = false; });

/* ================= المعاينة المصغرة ================= */
function setupPreviewVideo() {
  if (previewVideo) return;
  const src = video.currentSrc || video.src;
  if (!src) return;

  previewVideo = document.createElement('video');
  previewVideo.src = src;
  previewVideo.muted = true;
  previewVideo.preload = 'auto';
  previewVideo.addEventListener('loadeddata', () => { previewReady = true; });
  previewVideo.load();
}

let lastPreviewTime = 0;
progressContainer.addEventListener('mousemove', (e) => {
  if (!isFinite(video.duration) || !video.duration) return;

  const rect = progressContainer.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  const time = pct * video.duration;

  previewBox.style.display = 'block';
  const thumbWidth = 180;
  let leftPos = e.clientX - rect.left;

  if (leftPos < thumbWidth / 2) leftPos = thumbWidth / 2;
  if (leftPos > rect.width - thumbWidth / 2) leftPos = rect.width - thumbWidth / 2;

  previewBox.style.left = leftPos + 'px';
  previewTime.textContent = formatTime(time);

  if (previewReady && previewVideo && previewVideo.duration) {
    const now = Date.now();
    if (now - lastPreviewTime > 60) {
      lastPreviewTime = now;
      try { previewVideo.currentTime = time; } catch (err) {}
      previewVideo.onseeked = () => {
        try {
          previewCtx.drawImage(previewVideo, 0, 0, previewCanvas.width, previewCanvas.height);
        } catch (err) {}
      };
    }
  }
});

progressContainer.addEventListener('mouseleave', () => {
  previewBox.style.display = 'none';
});

/* ================= الصوت ================= */
volumeSlider.addEventListener('input', () => {
  video.volume = volumeSlider.value;
  video.muted = false;
  updateVolIcon();
});

muteBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  updateVolIcon();
});

function updateVolIcon() {
  if (video.muted || video.volume === 0) {
    volIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
  } else if (video.volume < 0.5) {
    volIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
  } else {
    volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }
}

/* ================= سرعة التشغيل ================= */
speedSelect.addEventListener('change', () => {
  video.playbackRate = parseFloat(speedSelect.value);
});

/* ================= ملء الشاشة ================= */
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    if (playerContainer.requestFullscreen) playerContainer.requestFullscreen();
    else if (playerContainer.webkitRequestFullscreen) playerContainer.webkitRequestFullscreen();
    else if (playerContainer.msRequestFullscreen) playerContainer.msRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }
});

/* ================= اختصارات الكيبورد ================= */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key) {
    case ' ': case 'k': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft':  video.currentTime = Math.max(0, video.currentTime - SKIP_SECONDS); break;
    case 'ArrowRight': video.currentTime = Math.min(video.duration || 0, video.currentTime + SKIP_SECONDS); break;
    case 'm': video.muted = !video.muted; updateVolIcon(); break;
    case 'f': fsBtn.click(); break;
  }
});
